<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>เซียมซี — DailyMu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ── Font: LINE Seed Sans TH (self-hosted) ── */
@font-face{font-family:'LINE Seed Sans TH';src:url('../../Slide/fonts/LINESeedSansTH_W_Rg.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'LINE Seed Sans TH';src:url('../../Slide/fonts/LINESeedSansTH_W_Bd.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
/* ═══════════════════════════════════════
   RESET + DESIGN TOKENS (DailyMu)
   ═══════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  /* ── Core Colors ── */
  --primary:#EC599D;--primary-light:#FDEFF5;
  --secondary:#7279FB;--secondary-light:#F1F2FF;
  /* ── Neutrals ── */
  --text-primary:#1B1D22;--text-secondary:#6A6E83;--text-tertiary:#9A9DAD;
  --bg-white:#FFFFFF;--bg-light:#F8F8F9;--bg-mid:#EBECEF;--border:#EBECEF;
  /* ── Feedback ── */
  --error:#EA244F;--error-bg:#FDE9ED;
  --warning:#C69A2A;--warning-bg:#FEF9EB;
  --success:#559652;--success-bg:#F0F8F0;
  /* ── Spacing (4px grid) ── */
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;--sp-12:48px;
  /* ── Radius ── */
  --r-sm:4px;--r-md:8px;--r-lg:12px;--r-xl:16px;--r-2xl:24px;--r-full:9999px;
  /* ── Typography ── */
  --font:'LINE Seed Sans TH','Noto Sans Thai',-apple-system,sans-serif;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:#1B1D22;display:flex;justify-content:center;align-items:center}

/* ═══════════════════════════════════════
   APP SHELL
   ═══════════════════════════════════════ */
#app{
  width:100vw;height:100vh;max-width:430px;max-height:932px;
  background:linear-gradient(180deg,var(--primary-light) 0%,var(--secondary-light) 40%,var(--bg-white) 100%);
  position:relative;overflow:hidden;
}
@media(min-width:431px){
  #app{border-radius:40px;box-shadow:0 0 60px rgba(0,0,0,.3);width:390px;height:844px}
}

/* ═══════════════════════════════════════
   SCREENS
   ═══════════════════════════════════════ */
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .5s cubic-bezier(.4,0,.2,1);
  will-change:transform,opacity;
}
.screen[data-state="next"]{transform:translateX(100%);opacity:0;pointer-events:none}
.screen[data-state="prev"]{transform:translateX(-100%);opacity:0;pointer-events:none}
.screen[data-state="active"]{transform:translateX(0);opacity:1}
.screen[data-state="hidden"]{display:none}

/* ═══════════════════════════════════════
   HEADER
   ═══════════════════════════════════════ */
.hdr{
  display:flex;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top,20px) var(--sp-4) 0;
  height:88px;min-height:88px;position:relative;z-index:10;
}
.hdr-back,.hdr-close{
  position:absolute;top:env(safe-area-inset-top,20px);width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
/* Heading.5: 24px as icon size */
  background:none;border:none;cursor:pointer;font-size:24px;color:var(--text-primary);
  border-radius:var(--r-full);transition:background .2s;
}
.hdr-back{left:var(--sp-2)}
.hdr-close{right:var(--sp-2)}
.hdr-back:active,.hdr-close:active{background:var(--bg-mid)}
/* Label.2: 18px/26px Bold */
.hdr-title{font-size:18px;line-height:26px;font-weight:700;color:var(--text-primary);padding-top:20px}

/* ═══════════════════════════════════════
   SCREEN 1 — WELCOME (Fantasy Landscape)
   ═══════════════════════════════════════ */
/* Fantasy BG override for welcome */
#s-welcome{
  background:
    radial-gradient(ellipse 60% 40% at 50% 15%,rgba(114,121,251,.12) 0%,transparent 100%),
    linear-gradient(180deg,#F1F2FF 0%,#FDEFF5 25%,#F8F0FF 50%,#FFFFFF 75%,#FDEFF5 100%);
}
.welcome-body{flex:1;display:flex;flex-direction:column;align-items:center;overflow:hidden;position:relative}

/* ── Light beam from top center ── */
.wb-light{
  position:absolute;top:-80px;left:50%;transform:translateX(-50%);
  width:360px;height:500px;
  background:radial-gradient(ellipse 50% 60% at 50% 0%,rgba(114,121,251,.10) 0%,rgba(236,89,157,.06) 40%,transparent 70%);
  pointer-events:none;z-index:0;
}

/* ── Floating Clouds (PNG image) ── */
.wb-cloud{
  position:absolute;pointer-events:none;z-index:1;
  will-change:transform;
}
.wb-cloud img{width:100%;height:auto;display:block}
.wb-cloud-1{top:0%;left:-20%;width:280px;opacity:.4;animation:cloud-drift-1 22s ease-in-out infinite}
.wb-cloud-2{top:10%;right:-25%;width:240px;opacity:.3;animation:cloud-drift-2 28s ease-in-out infinite}
.wb-cloud-3{top:32%;left:-10%;width:200px;opacity:.25;animation:cloud-drift-3 19s ease-in-out infinite}
.wb-cloud-4{bottom:25%;right:-15%;width:260px;opacity:.35;animation:cloud-drift-4 24s ease-in-out infinite}
.wb-cloud-5{top:5%;left:20%;width:160px;opacity:.18;animation:cloud-drift-5 32s ease-in-out infinite}
.wb-cloud-6{bottom:35%;left:-15%;width:220px;opacity:.22;animation:cloud-drift-6 20s ease-in-out infinite}
.wb-cloud-7{bottom:12%;right:5%;width:180px;opacity:.28;animation:cloud-drift-7 26s ease-in-out infinite}

@keyframes cloud-drift-1{0%,100%{transform:translateX(0) translateY(0)}50%{transform:translateX(50px) translateY(12px)}}
@keyframes cloud-drift-2{0%,100%{transform:translateX(0) translateY(0)}50%{transform:translateX(-45px) translateY(-8px)}}
@keyframes cloud-drift-3{0%,100%{transform:translateX(0) translateY(0)}50%{transform:translateX(35px) translateY(6px)}}
@keyframes cloud-drift-4{0%,100%{transform:translateX(0) translateY(0)}50%{transform:translateX(-50px) translateY(-12px)}}
@keyframes cloud-drift-5{0%,100%{transform:translateX(0) translateY(0)}50%{transform:translateX(25px) translateY(10px)}}
@keyframes cloud-drift-6{0%,100%{transform:translateX(0) translateY(0)}50%{transform:translateX(30px) translateY(-6px)}}
@keyframes cloud-drift-7{0%,100%{transform:translateX(0) translateY(0)}50%{transform:translateX(-35px) translateY(8px)}}

/* ── Bottom mist fade (keep for depth) ── */
.wb-mist-bottom{
  position:absolute;left:0;right:0;bottom:0;height:120px;pointer-events:none;z-index:2;
  background:linear-gradient(180deg,transparent 0%,rgba(255,255,255,.6) 30%,rgba(241,242,255,.8) 60%,#FDEFF5 100%);
}

/* ── Kept keyframes for result/fortune screens ── */
@keyframes petal-fall{
  0%{transform:translateY(-20px) rotate(0deg) translateX(0);opacity:0}
  10%{opacity:.6}
  50%{transform:translateY(50vh) rotate(180deg) translateX(30px);opacity:.5}
  80%{opacity:.3}
  100%{transform:translateY(100vh) rotate(360deg) translateX(-10px);opacity:0}
}
@keyframes sparkle-twinkle{
  0%,100%{opacity:0;transform:scale(.3)}
  50%{opacity:.9;transform:scale(1)}
}

/* ── Illustration with glow aura ── */
.welcome-illust{flex:1;display:flex;align-items:center;justify-content:center;position:relative;width:100%;z-index:3}
.welcome-illust::before{
  content:'';position:absolute;width:280px;height:280px;
  background:radial-gradient(circle,rgba(114,121,251,.15) 0%,rgba(236,89,157,.10) 40%,transparent 70%);
  border-radius:50%;filter:blur(30px);pointer-events:none;
  animation:glow-pulse 4s ease-in-out infinite;
}
@keyframes glow-pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.15);opacity:1}}
.welcome-hero-img{max-width:70%;max-height:100%;object-fit:contain;position:relative;z-index:1;animation:fi-float 4s ease-in-out infinite}

/* ── Heading + subtitle ── */
.welcome-info{text-align:center;padding:var(--sp-2) var(--sp-6) 0;position:relative;z-index:3}
/* Heading.3: 32px/40px Bold */
.welcome-heading{font-size:32px;line-height:40px;font-weight:700;color:var(--text-primary)}
.welcome-heading em{font-style:normal;background:linear-gradient(90deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
/* Caption.3: 16px/24px Regular */
.welcome-sub{font-size:16px;line-height:24px;color:var(--text-secondary);margin-top:var(--sp-1)}

/* Fortune sticks illustration (image-based) */
.fi{position:relative;width:280px;height:400px;animation:fi-float 4s ease-in-out infinite}
@keyframes fi-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.fi-pot-back{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);z-index:1;
}
.fi-container{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);z-index:3;
}
.fi-pot-img{width:200px;height:auto;display:block}
.fi-sticks{
  position:absolute;bottom:110px;left:50%;transform:translateX(-50%);
  width:140px;height:220px;z-index:2;
}
.fi-stick{
  position:absolute;bottom:0;left:50%;
  transform-origin:bottom center;
  transition:transform .15s ease;
}
.fi-stick-img{height:100%;width:auto;display:block;pointer-events:none}
/* Decorative swirls */
.fi-swirl{
  position:absolute;width:20px;height:20px;border:2px solid var(--secondary);
  border-radius:50%;border-right-color:transparent;border-bottom-color:transparent;
}
.fi-swirl-1{top:80px;right:20px;animation:swirl-spin 3s linear infinite}
.fi-swirl-2{top:120px;left:15px;width:14px;height:14px;animation:swirl-spin 4s linear infinite reverse}
.fi-swirl-3{bottom:100px;right:10px;width:10px;height:10px;animation:swirl-spin 2.5s linear infinite}
.fi-swirl-4{top:60px;left:40px;width:8px;height:8px;border-width:1.5px;animation:swirl-spin 3.5s linear infinite reverse}
@keyframes swirl-spin{to{transform:rotate(360deg)}}

/* Start CTA — full-width gradient button */
.welcome-footer{padding:var(--sp-4) var(--sp-6) var(--sp-8)}
.btn-start{
  width:100%;height:56px;border-radius:var(--r-full);
  background:linear-gradient(90deg,var(--primary),var(--secondary));
  color:#fff;border:none;cursor:pointer;
/* Label.3: 16px/24px Bold */
  font-size:16px;line-height:24px;font-weight:700;font-family:var(--font);
  display:flex;align-items:center;justify-content:center;gap:var(--sp-2);
  box-shadow:0 4px 16px rgba(236,89,157,.3);
  transition:transform .2s,box-shadow .2s;
}
.btn-start:active{transform:scale(.97);box-shadow:0 2px 8px rgba(236,89,157,.2)}

/* ═══════════════════════════════════════
   SCREEN 2 — SHAKE (Full-screen tap)
   ═══════════════════════════════════════ */
.shake-body{
  flex:1;display:flex;flex-direction:column;align-items:center;overflow:hidden;position:relative;
  cursor:grab;-webkit-user-select:none;user-select:none;touch-action:none;
}
.shake-body:active{cursor:grabbing}
/* Energy bar — top, below header */
.shake-energy-wrap{
  width:100%;padding:0 var(--sp-6);flex-shrink:0;
}
.shake-energy-bar{
  width:100%;height:6px;border-radius:var(--r-full);
  background:var(--bg-mid);overflow:hidden;
}
.shake-energy-fill{
  height:100%;width:5%;border-radius:var(--r-full);
  background:linear-gradient(90deg,var(--primary),var(--secondary));
  transition:width .15s ease;
}
/* Shake area — illustration centered */
.shake-area{
  flex:1;display:flex;align-items:center;justify-content:center;
  position:relative;width:100%;pointer-events:none;
}
/* Info below illustration */
.shake-info{text-align:center;padding:0 var(--sp-6) var(--sp-8)}
/* Heading.5: 24px/32px Bold */
.shake-heading{font-size:24px;line-height:32px;font-weight:700;color:var(--text-primary)}
/* Caption.4: 14px/22px Regular */
.shake-sub{
  margin-top:var(--sp-1);color:var(--text-secondary);font-size:14px;
  line-height:22px;
}
/* Shake hint */
.shake-hint{
  color:var(--text-tertiary);font-size:12px;line-height:20px;text-align:center;
  margin-top:var(--sp-2);
  animation:hint-pulse 2s ease-in-out infinite;
}
@keyframes hint-pulse{0%,100%{opacity:.4}50%{opacity:1}}
/* Vibration lines */
.vib-line{
  position:absolute;border:2px solid var(--primary);border-radius:50%;
  opacity:0;pointer-events:none;
}

/* ═══════════════════════════════════════
   SCREEN 3 — RESULT (Mystical Reveal)
   ═══════════════════════════════════════ */
#s-result{
  background:
    radial-gradient(ellipse 60% 40% at 50% 15%,rgba(114,121,251,.10) 0%,transparent 100%),
    linear-gradient(180deg,#F1F2FF 0%,#FDEFF5 25%,#F8F0FF 50%,#FFFFFF 75%,#FDEFF5 100%);
}
.result-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:0}

/* Landscape bg layers */
.result-body .rb-hill{position:absolute;border-radius:50%;pointer-events:none;z-index:0}
.rb-hill-1{bottom:5%;left:-30px;width:180px;height:200px;background:radial-gradient(ellipse at 50% 100%,rgba(114,121,251,.07) 0%,transparent 70%)}
.rb-hill-2{bottom:2%;right:-40px;width:200px;height:240px;background:radial-gradient(ellipse at 50% 100%,rgba(236,89,157,.06) 0%,transparent 70%)}
.result-body .rb-mist{position:absolute;left:0;right:0;bottom:0;height:100px;pointer-events:none;z-index:0;
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.5) 40%,rgba(241,242,255,.7) 100%);}
.result-body .rb-petal{
  position:absolute;pointer-events:none;z-index:0;
  width:7px;height:4px;border-radius:50% 50% 50% 0;opacity:0;
  animation:petal-fall linear infinite;
}
.result-body .rb-petal:nth-child(1){left:12%;animation-duration:9s;animation-delay:0s;background:rgba(236,89,157,.2)}
.result-body .rb-petal:nth-child(2){left:80%;animation-duration:11s;animation-delay:2s;background:rgba(114,121,251,.18)}
.result-body .rb-petal:nth-child(3){left:40%;animation-duration:10s;animation-delay:3.5s;background:rgba(236,89,157,.15)}
.result-body .rb-petal:nth-child(4){left:65%;animation-duration:8.5s;animation-delay:1s;background:rgba(114,121,251,.2)}

/* ── Radial light burst behind blob ── */
.result-burst{
  position:absolute;width:400px;height:400px;pointer-events:none;z-index:1;
  opacity:0;transition:opacity 1s ease;
}
.result-burst.show{opacity:1}
.result-burst::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(circle,rgba(236,89,157,.12) 0%,transparent 50%),
    radial-gradient(circle,rgba(114,121,251,.10) 0%,transparent 60%);
  filter:blur(20px);
  animation:burst-pulse 3s ease-in-out infinite;
}
.result-burst::after{
  content:'';position:absolute;inset:40px;
  background:radial-gradient(circle,rgba(255,255,255,.3) 0%,transparent 60%);
  filter:blur(10px);
}
@keyframes burst-pulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.1);opacity:1}}

/* ── Glowing rings ── */
.result-ring{
  position:absolute;border-radius:50%;pointer-events:none;z-index:1;
  border:1.5px solid transparent;
  opacity:0;transform:scale(.5);
  transition:opacity .6s ease,transform .8s cubic-bezier(.34,1.56,.64,1);
}
.result-ring.show{opacity:1;transform:scale(1)}
.result-ring-1{
  width:300px;height:300px;
  border-color:rgba(236,89,157,.15);
  animation:ring-spin 20s linear infinite;
}
.result-ring-2{
  width:340px;height:340px;
  border-color:rgba(114,121,251,.10);
  border-style:dashed;
  animation:ring-spin 30s linear infinite reverse;
}
.result-ring-3{
  width:380px;height:380px;
  border-color:rgba(236,89,157,.06);
  animation:ring-spin 25s linear infinite;
}
@keyframes ring-spin{to{transform:rotate(360deg)}}
/* Ring dots — orbiting particles */
.result-ring-1::before,.result-ring-1::after,
.result-ring-2::before,.result-ring-2::after{
  content:'';position:absolute;border-radius:50%;
}
.result-ring-1::before{top:-3px;left:50%;width:6px;height:6px;background:var(--primary);box-shadow:0 0 8px rgba(236,89,157,.5)}
.result-ring-1::after{bottom:-3px;right:30%;width:4px;height:4px;background:var(--secondary);box-shadow:0 0 6px rgba(114,121,251,.5)}
.result-ring-2::before{top:20%;right:-3px;width:5px;height:5px;background:var(--primary);opacity:.6;box-shadow:0 0 6px rgba(236,89,157,.4)}
.result-ring-2::after{bottom:20%;left:-2px;width:3px;height:3px;background:var(--secondary);opacity:.5;box-shadow:0 0 4px rgba(114,121,251,.4)}

/* ── Fortune stick reveal (Result screen) ── */
.result-stick-reveal{
  position:absolute;z-index:4;pointer-events:none;
  opacity:0;
  transform:rotate(-5deg) scale(.5);
  transition:all .8s cubic-bezier(.34,1.56,.64,1);
}
/* ไม้ 1 — เต็มแท่ง ลอยขึ้นมา */
.result-stick-reveal.phase1{
  opacity:1;
  transform:rotate(-3deg) scale(1);
}
/* ไม้ 2 — ซูมเข้า + เรืองแสง */
.result-stick-reveal.phase2{
  opacity:1;
  transform:rotate(0deg) scale(1.5);
  transition:all 1s cubic-bezier(.4,0,.2,1);
}
.result-stick-reveal.phase2 img{
  filter:
    drop-shadow(0 0 25px rgba(236,89,157,.6))
    drop-shadow(0 0 50px rgba(114,121,251,.4))
    drop-shadow(0 0 80px rgba(236,89,157,.3))
    brightness(1.15);
}
/* ไม้ 3 — ซูมเหลือครึ่งบน เน้นหัวไม้ */
.result-stick-reveal.phase3{
  opacity:1;
  transform:rotate(0deg) scale(3) translateY(35%);
  transition:all 1s cubic-bezier(.4,0,.2,1);
}
.result-stick-reveal.phase3 img{
  filter:
    drop-shadow(0 0 30px rgba(236,89,157,.7))
    drop-shadow(0 0 60px rgba(114,121,251,.5))
    brightness(1.2);
}
.result-stick-reveal img{
  height:320px;width:auto;
  filter:drop-shadow(0 0 12px rgba(114,121,251,.35));
  transition:filter .8s ease;
}
/* Aura ring */
.result-stick-aura{
  position:absolute;top:50%;left:50%;
  width:200px;height:200px;
  transform:translate(-50%,-50%) scale(0);
  border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(236,89,157,.15) 0%,rgba(114,121,251,.10) 40%,transparent 70%);
  opacity:0;transition:all .6s ease;
}
.result-stick-reveal.phase2 .result-stick-aura,
.result-stick-reveal.phase3 .result-stick-aura{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
  animation:stick-aura-pulse 1.2s ease-in-out infinite;
}
@keyframes stick-aura-pulse{
  0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.6}
  50%{transform:translate(-50%,-50%) scale(1.3);opacity:1}
}

/* ── Number bubble (appears at tip in phase 3) ── */
.result-num-bubble{
  position:absolute;z-index:7;pointer-events:none;
  top:calc(38% - 12px);left:50%;
  transform:translate(-50%,-50%) scale(0);
  width:110px;height:110px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  box-shadow:0 0 30px rgba(236,89,157,.4),0 0 60px rgba(114,121,251,.25);
  display:flex;align-items:center;justify-content:center;
  opacity:0;
  transition:opacity 0s,transform 0s; /* instant hide */
}
.result-num-bubble.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
  transition:all .6s cubic-bezier(.34,1.56,.64,1);
}
/* Glossy highlight */
.result-num-bubble::after{
  content:'';position:absolute;
  top:10%;left:15%;width:45%;height:35%;
  background:radial-gradient(ellipse at 40% 30%,rgba(255,255,255,.3) 0%,transparent 70%);
  border-radius:50%;
}
.result-num-bubble-val{
  font-size:48px;font-weight:700;color:#fff;
  font-family:var(--font);
  text-shadow:0 2px 15px rgba(0,0,0,.15);
  position:relative;z-index:1;
}

/* ── Central orb (blob) ── */
.result-blob{
  position:relative;width:220px;height:220px;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  z-index:2;
}
.result-blob-bg{
  position:absolute;inset:0;
  background:linear-gradient(135deg,var(--primary) 0%,var(--secondary) 100%);
  border-radius:50%;
  box-shadow:
    0 0 40px rgba(236,89,157,.25),
    0 0 80px rgba(114,121,251,.15),
    inset 0 -10px 30px rgba(0,0,0,.1);
  transform:scale(0);transition:transform .8s cubic-bezier(.34,1.56,.64,1);
}
.result-blob-bg.show{transform:scale(1)}
/* Glossy highlight */
.result-blob-bg::after{
  content:'';position:absolute;
  top:10%;left:15%;width:50%;height:40%;

.result-number.show{opacity:1;transform:scale(1)}

/* ── Label above number ── */
.result-label{
  position:relative;z-index:2;
  font-size:14px;line-height:22px;font-weight:700;color:rgba(255,255,255,.7);
  letter-spacing:1px;margin-bottom:var(--sp-1);
  opacity:0;transform:translateY(10px);transition:all .4s ease .2s;
}
.result-label.show{opacity:1;transform:translateY(0)}

/* ── Subtitle below blob ── */
.result-subtitle{
  position:absolute;top:36px;left:0;right:0;
  text-align:center;z-index:10;
  opacity:0;transform:translateY(10px);
  transition:opacity 0s,transform 0s;
}
.result-subtitle.show{opacity:1;transform:translateY(0);transition:all .5s ease .4s}
.result-subtitle-text{
  font-size:20px;line-height:28px;font-weight:700;
  background:linear-gradient(90deg,var(--primary),var(--secondary));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.result-subtitle-hint{
  font-size:14px;line-height:22px;color:var(--text-tertiary);margin-top:2px;
}

/* ── Floating stars (more + bigger) ── */
.result-star{
  position:absolute;opacity:0;pointer-events:none;z-index:3;
  transition:opacity .4s,transform .4s;
}
.result-star.show{opacity:1}
.result-star:nth-child(1){top:15%;right:15%;font-size:20px;color:var(--primary);animation:star-float 3s ease-in-out infinite}
.result-star:nth-child(2){bottom:25%;left:12%;font-size:14px;color:var(--secondary);animation:star-float 3.5s ease-in-out infinite .5s}
.result-star:nth-child(3){top:25%;left:10%;font-size:16px;color:var(--primary);opacity:.5;animation:star-float 2.8s ease-in-out infinite 1s}
.result-star:nth-child(4){bottom:35%;right:10%;font-size:12px;color:var(--secondary);animation:star-float 4s ease-in-out infinite .3s}
.result-star:nth-child(5){top:10%;left:30%;font-size:10px;color:var(--primary);opacity:.4;animation:star-float 3.2s ease-in-out infinite 1.5s}
.result-star:nth-child(6){bottom:20%;right:25%;font-size:18px;color:var(--secondary);animation:star-float 3.8s ease-in-out infinite .8s}
@keyframes star-float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(15deg)}}

/* ── CTA button (floating) ── */
.result-footer{
  position:absolute;bottom:0;left:0;right:0;z-index:10;
  padding:var(--sp-4) var(--sp-6) var(--sp-8);
}
.btn-read{
  width:100%;height:52px;border-radius:var(--r-full);
  background:linear-gradient(90deg,var(--primary),var(--secondary));color:#fff;border:none;cursor:pointer;
  font-size:16px;line-height:24px;font-weight:700;font-family:var(--font);
  box-shadow:0 4px 16px rgba(236,89,157,.3);

}
.btn-read.show{transform:translateY(0);opacity:1;transition:all .5s cubic-bezier(.4,0,.2,1)}
.btn-read:active{transform:scale(.97)}

.fortune-body .fb-petal:nth-child(3){left:25%;animation-duration:10s;animation-delay:4s;background:rgba(236,89,157,.15)}

  width:3px;height:3px;opacity:0;animation:sparkle-twinkle 3s ease-in-out infinite;
}
.fortune-body .fb-sparkle:nth-child(5){top:12%;left:10%;animation-delay:.5s}
.fortune-body .fb-sparkle:nth-child(6){top:20%;right:8%;animation-delay:1.5s;box-shadow:0 0 4px rgba(236,89,157,.4)}
.fortune-body .fb-sparkle:nth-child(7){bottom:18%;left:15%;animation-delay:2s}
.fortune-body .fb-sparkle:nth-child(8){bottom:25%;right:12%;animation-delay:.8s;box-shadow:0 0 4px rgba(236,89,157,.4)}

.fortune-card-wrap{flex:1;min-height:0;padding:0 var(--sp-5);display:flex;flex-direction:column;position:relative;z-index:1}
.fortune-card{
  flex:1;min-height:0;display:flex;flex-direction:column;position:relative;
  background:linear-gradient(170deg,rgba(255,255,255,.92) 0%,rgba(253,239,245,.6) 50%,rgba(241,242,255,.5) 100%);
  border-radius:var(--r-lg);
  box-shadow:0 4px 30px rgba(0,0,0,.06);
  overflow:hidden;
}
/* Ornamental double border */
.fortune-card::before{
  content:'';position:absolute;inset:6px;
  border:1.5px solid rgba(114,121,251,.15);
  border-radius:calc(var(--r-lg) - 2px);pointer-events:none;z-index:1;
}
.fortune-card::after{
  content:'';position:absolute;inset:10px;
  border:1px solid rgba(236,89,157,.10);
  border-radius:calc(var(--r-lg) - 6px);pointer-events:none;z-index:1;
}
/* Corner ornaments */
.fc-ornament{
  position:absolute;width:28px;height:28px;z-index:2;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;line-height:1;color:rgba(114,121,251,.25);
}
.fc-ornament-tl{top:2px;left:2px;transform:rotate(0deg)}
.fc-ornament-tr{top:2px;right:2px;transform:rotate(90deg)}
.fc-ornament-bl{bottom:2px;left:2px;transform:rotate(-90deg)}
.fc-ornament-br{bottom:2px;right:2px;transform:rotate(180deg)}

/* Card content */
.fortune-card-content{
  flex:1;min-height:0;padding:var(--sp-8) var(--sp-6) var(--sp-5);
  display:flex;flex-direction:column;align-items:center;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  position:relative;z-index:1;
}
/* Brand label — Caption.5 */
.fortune-brand{color:var(--text-tertiary);font-size:12px;line-height:20px;letter-spacing:2px;text-transform:uppercase;margin-bottom:var(--sp-1)}
/* Fortune number — Heading.1 style */
.fortune-num-big{
  font-size:56px;line-height:64px;font-weight:700;
  background:linear-gradient(180deg,var(--primary) 0%,var(--secondary) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:var(--sp-5);
}
/* Divider */
.fortune-divider{
  width:40px;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--primary),var(--secondary),transparent);
  margin-bottom:var(--sp-5);border-radius:1px;
}
/* Caption.3: 16px/24px Regular — fortune text */
.fortune-text{
  color:var(--text-secondary);font-size:16px;line-height:28px;
  text-align:center;max-width:280px;
}
.fortune-text p{margin-bottom:var(--sp-1)}
/* Share button inside card — pill gradient */
.btn-share-card{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  margin:var(--sp-5) auto 0;padding:10px 28px;
  border-radius:var(--r-full);border:none;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff;font-size:14px;line-height:22px;font-weight:700;font-family:var(--font);
  cursor:pointer;transition:all .2s;
  box-shadow:0 4px 14px rgba(236,89,157,.2);
}
.btn-share-card:active{transform:scale(.95);box-shadow:0 2px 8px rgba(236,89,157,.15)}
.btn-share-card svg{opacity:.9}
/* Footer inside card */
.fortune-card-footer{
  margin-top:auto;padding-top:var(--sp-5);
  display:flex;flex-direction:column;align-items:center;gap:0;
}
.fortune-card-footer-label{color:var(--text-tertiary);font-size:12px;line-height:20px}
.fortune-card-footer-num{color:var(--text-tertiary);font-size:14px;line-height:22px;font-weight:700}

/* ── Fortune level badge ── */
.fortune-level-badge{
  display:inline-flex;align-items:center;gap:var(--sp-1);
  padding:var(--sp-1) var(--sp-3);border-radius:var(--r-full);
  font-size:12px;line-height:20px;font-weight:700;
  margin-bottom:var(--sp-4);
}
.fortune-level-badge::before{content:'';width:6px;height:6px;border-radius:50%}
.fortune-level-badge[data-level="excellent"]{background:var(--success-bg);color:var(--success)}
.fortune-level-badge[data-level="excellent"]::before{background:var(--success)}
.fortune-level-badge[data-level="good"]{background:var(--primary-light);color:var(--primary)}
.fortune-level-badge[data-level="good"]::before{background:var(--primary)}
.fortune-level-badge[data-level="fair"]{background:var(--warning-bg);color:var(--warning)}
.fortune-level-badge[data-level="fair"]::before{background:var(--warning)}
.fortune-level-badge[data-level="caution"]{background:var(--error-bg);color:var(--error)}
.fortune-level-badge[data-level="caution"]::before{background:var(--error)}

.fortune-title{
  font-size:18px;line-height:26px;font-weight:700;color:var(--text-primary);
  text-align:center;margin-bottom:var(--sp-5);
}

.fortune-section-label{
  display:flex;align-items:center;gap:var(--sp-2);width:100%;margin-bottom:var(--sp-3);
}
.fortune-section-label::before,.fortune-section-label::after{
  content:'';flex:1;height:1px;background:var(--border);
}
.fortune-section-label span{
  font-size:12px;line-height:20px;font-weight:700;color:var(--text-tertiary);
  letter-spacing:1px;white-space:nowrap;
}

/* ── Poem section ── */
.fortune-poem{
  width:100%;padding:var(--sp-4);
  background:linear-gradient(135deg,rgba(241,242,255,.4),rgba(253,239,245,.4));
  border-radius:var(--r-md);border:1px solid rgba(114,121,251,.1);
  margin-bottom:var(--sp-5);
}
.fortune-poem p{
  font-size:14px;line-height:24px;color:var(--text-secondary);
  text-align:center;margin:0;
}
.fortune-poem p.poem-indent{
  text-indent:1.5em;text-align:left;
}

.fortune-payakorn,.fortune-advice{
  width:100%;text-align:left;margin-bottom:var(--sp-5);
}
.fortune-payakorn p,.fortune-advice p{
  font-size:15px;line-height:26px;color:var(--text-secondary);margin:0;
}

.fortune-lucky-wrap{

}
.fortune-lucky-num{
  width:44px;height:44px;border-radius:var(--r-full);
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff;font-size:16px;font-weight:700;

  box-shadow:0 2px 8px rgba(236,89,157,.25);

.fortune-actions{
  display:flex;flex-direction:row;gap:var(--sp-3);
  padding:var(--sp-4) var(--sp-5) var(--sp-6);position:relative;z-index:1;
}
/* Label.3: 16px/24px Bold */
.btn-retry,.btn-share{

.btn-retry:active,.btn-share:active{transform:scale(.97)}
.btn-icon{font-size:18px}

   ═══════════════════════════════════════ */
#confetti{position:absolute;inset:0;pointer-events:none;z-index:50}

/* ═══════════════════════════════════════
   ANIMATIONS — SHAKING STATE
   ═══════════════════════════════════════ */
.fi.shaking .fi-stick{animation:stick-rattle .12s ease-in-out infinite alternate}
.fi.shaking .fi-stick:nth-child(odd){animation-delay:.06s}
.fi.shaking .fi-container,.fi.shaking .fi-pot-back{animation:pot-shake .1s ease-in-out infinite alternate}
@keyframes stick-rattle{
  from{transform:translateX(calc(-50% + var(--sx))) rotate(calc(var(--rot) - 4deg))}
  to{transform:translateX(calc(-50% + var(--sx))) rotate(calc(var(--rot) + 4deg))}
}
@keyframes pot-shake{from{transform:translateX(-52%) rotate(-2deg)}to{transform:translateX(-48%) rotate(2deg)}}

/* Rising stick animation */
.fi-stick.rising{
  animation:stick-rise 1.2s cubic-bezier(.4,0,.2,1) forwards !important;
  z-index:10;
}
@keyframes stick-rise{
  0%{transform:translateX(calc(-50% + var(--sx))) rotate(var(--rot));filter:none}
  /* Glow uses --secondary (#7279FB) = rgb(114,121,251) */
  40%{filter:drop-shadow(0 0 8px rgba(114,121,251,.6))}
  100%{transform:translateX(calc(-50% + var(--sx))) rotate(0deg) translateY(-120px);filter:drop-shadow(0 0 12px rgba(114,121,251,.8))}
}

/* ═══════════════════════════════════════

   ═══════════════════════════════════════ */
@media(prefers-reduced-motion:reduce){
  .screen{transition-duration:.01s}

}

.flash-overlay{
  position:absolute;inset:0;background:#fff;z-index:40;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.flash-overlay.show{opacity:1;pointer-events:auto}

/* ═══════════════════════════════════════
   SOUND SYSTEM (Web Audio API)
   ═══════════════════════════════════════ */
let audioCtx=null;
function getAudioCtx(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  return audioCtx;
}

/* เสียงกระทบไม้ — สั้น คม เหมือนไม้เซียมซีกระทบกัน */
/* เสียงกระทบไม้ — ดังขึ้นตาม energy (0-100) + pitch สูงขึ้น */
function playSfxShake(){
  const ctx=getAudioCtx();
  const t=ctx.currentTime;
  const pct=Math.min(energy,100)/100; /* 0→1 */

  /* Volume: 0.1 (เริ่ม) → 0.7 (เต็ม) */
  const vol=0.1+pct*0.6;
  /* Pitch: 800 (เริ่ม) → 1800 (เต็ม) */
  const freq=800+pct*1000+Math.random()*300;
  /* Duration: ยาวขึ้นเมื่อใกล้เต็ม */
  const dur=0.03+pct*0.03;

  const len=Math.floor(ctx.sampleRate*dur);
  const buf=ctx.createBuffer(1,len,ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1);

  const src=ctx.createBufferSource();
  src.buffer=buf;

  const bp=ctx.createBiquadFilter();
  bp.type='bandpass';
  bp.frequency.value=freq;
  bp.Q.value=4+pct*6;

  const hp=ctx.createBiquadFilter();
  hp.type='highpass';
  hp.frequency.value=300+pct*300;

  const gain=ctx.createGain();
  gain.gain.setValueAtTime(vol,t);
  gain.gain.exponentialRampToValueAtTime(0.001,t+dur+0.01);

  src.connect(bp);bp.connect(hp);hp.connect(gain);gain.connect(ctx.destination);
  src.start(t);src.stop(t+dur+0.02);
}

/* เสียงไม้ลอยขึ้น — ascending shimmer */
function playSfxRise(){
  const ctx=getAudioCtx();
  const t=ctx.currentTime;
  [440,587,740,880].forEach((freq,i)=>{
    const osc=ctx.createOscillator();
    osc.type='sine';
    osc.frequency.value=freq;
    const g=ctx.createGain();
    g.gain.setValueAtTime(0,t+i*0.12);
    g.gain.linearRampToValueAtTime(0.15,t+i*0.12+0.04);
    g.gain.exponentialRampToValueAtTime(0.001,t+i*0.12+0.35);
    osc.connect(g);g.connect(ctx.destination);
    osc.start(t+i*0.12);osc.stop(t+i*0.12+0.35);
  });
}

/* เสียง chime ตอนเฉลยเลข — C5 E5 G5 chord */
function playSfxReveal(){
  const ctx=getAudioCtx();
  const t=ctx.currentTime;
  [523.25,659.25,783.99].forEach((freq,i)=>{
    const osc=ctx.createOscillator();
    osc.type='triangle';
    osc.frequency.value=freq;
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.18,t+i*0.08);
    g.gain.exponentialRampToValueAtTime(0.001,t+i*0.08+0.6);
    osc.connect(g);g.connect(ctx.destination);
    osc.start(t+i*0.08);osc.stop(t+i*0.08+0.6);
  });
}

/* ═══════════════════════════════════════
   SCREEN TRANSITIONS
   ═══════════════════════════════════════ */
function goTo(screenId,direction='forward'){
  const screens=['s-welcome','s-shake','s-result','s-fortune'];
  screens.forEach(id=>{
    const el=$('#'+id);
    if(id===screenId){
      el.dataset.state='active';
    }else{
      /* determine if this screen is "before" or "after" */
      const targetIdx=screens.indexOf(screenId);
      const thisIdx=screens.indexOf(id);
      el.dataset.state=thisIdx<targetIdx?'prev':'next';
    }
  });
  currentScreen=screenId.replace('s-','');
}

async function transitionTo(screenId){
  if(screenId==='s-result'){
    /* Seamless — ไม่ flash ให้ต่อเนื่องจากไม้ที่ดึงขึ้นมา */
    goTo(screenId);
    await wait(50);
    playResultAnimation();
  }else{
    goTo(screenId);
  }
}

/* ═══════════════════════════════════════
   EVENT BINDING
   ═══════════════════════════════════════ */
function bindEvents(){
  /* Welcome → Shake */
  $('#btn-start').addEventListener('click',()=>{
    goTo('s-shake');
    requestMotionPermission();
  });

  /* Shake back */
  $('#shake-back').addEventListener('click',()=>{
    resetShakeState();
    goTo('s-welcome');
  });

  /* Shake interactions */
  const shakeArea=$('#shake-area');
  let tapCount=0;
  let rapidTapTimer=null;

  /* Tap anywhere on shake body — adds energy */
  let holdInterval=null;
  shakeArea.addEventListener('pointerdown',(e)=>{
    e.preventDefault();
    if(energy>=100)return;
    addEnergy(6);
    tapCount++;
    triggerVisualClink();
    playSfxShake();
    haptic(15);
    clearTimeout(rapidTapTimer);
    rapidTapTimer=setTimeout(()=>{tapCount=0},600);
    /* Hold to continuously add energy */
    let holdTick=0;
    holdInterval=setInterval(()=>{
      if(energy>=100){clearInterval(holdInterval);return}
      addEnergy(2);
      haptic(10);
      holdTick++;
      if(holdTick%3===0)playSfxShake(); /* เล่นเสียงทุก 3 tick (~180ms) */
    },60);
  });
  const stopHold=()=>{clearInterval(holdInterval);holdInterval=null};
  shakeArea.addEventListener('pointerup',stopHold);
  shakeArea.addEventListener('pointerleave',stopHold);
  shakeArea.addEventListener('pointercancel',stopHold);

  /* Result → Read fortune */
  $('#btn-read').addEventListener('click',()=>{
    goTo('s-fortune');
    showFortune();
  });

  /* Result back */
  $('#result-back').addEventListener('click',()=>{
    resetShakeState();
    goTo('s-shake');
  });

  /* Fortune back */
  $('#fortune-back').addEventListener('click',()=>{
    goTo('s-result');
  });

  /* Fortune close → back to parent fortune-hub or restart */
  $('#fortune-close').addEventListener('click',()=>{
    try{ window.parent.navigateTo('fortune-hub'); }catch(e){}
    try{ window.parent.postMessage({action:'navigateTo',screen:'fortune-hub'},'*'); }catch(e){}
    resetAll();
    goTo('s-welcome');
  });

  /* Retry */
  $('#btn-retry').addEventListener('click',()=>{
    resetAll();
    goTo('s-shake');
  });

  /* Go home (was share) */
  $('#btn-share').addEventListener('click',()=>{
    resetAll();
    goTo('s-welcome');
  });

  /* Welcome back (close app / go back) */
  $('#s-welcome .hdr-back').addEventListener('click',()=>{
    try{ window.parent.navigateTo('fortune-hub'); }catch(e){}
    try{ window.parent.postMessage({action:'navigateTo',screen:'fortune-hub'},'*'); }catch(e){}
    if(window.history.length>1)window.history.back();
  });
}

/* ═══════════════════════════════════════
   SHAKE DETECTION (DeviceMotion)
   ═══════════════════════════════════════ */
function requestMotionPermission(){
  if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
    DeviceMotionEvent.requestPermission().then(state=>{
      if(state==='granted'){
        motionPermission=true;
        startMotionListener();
      }
    }).catch(()=>{});
  }else if('DeviceMotionEvent' in window){
    motionPermission=true;
    startMotionListener();
  }
}

let lastAcc={x:0,y:0,z:0};
function startMotionListener(){
  window.addEventListener('devicemotion',handleMotion);
}

function handleMotion(e){
  if(currentScreen!=='shake'||energy>=100)return;
  const a=e.accelerationIncludingGravity;
  if(!a)return;
  const dx=Math.abs(a.x-lastAcc.x);
  const dy=Math.abs(a.y-lastAcc.y);
  const dz=Math.abs(a.z-lastAcc.z);
  const total=dx+dy+dz;
  lastAcc={x:a.x,y:a.y,z:a.z};
  if(total>18){
    addEnergy(Math.min(8,total/5));
    haptic(15);
    playSfxShake();
  }
}

/* ═══════════════════════════════════════
   ENERGY SYSTEM
   ═══════════════════════════════════════ */
function addEnergy(amount){
  if(energy>=100)return;
  energy=Math.min(100,energy+amount);
  updateEnergyUI();
  setShaking(true);

  clearTimeout(energyDecayTimer);
  energyDecayTimer=setTimeout(()=>{
    if(energy<100)decayEnergy();
  },800);

  if(energy>=100){
    triggerReveal();
  }
}

function decayEnergy(){
  if(energy<=0||energy>=100){setShaking(false);return}
  energy=Math.max(0,energy-1);
  updateEnergyUI();
  if(energy>0){
    energyDecayTimer=setTimeout(decayEnergy,60);
  }else{
    setShaking(false);
  }
}

function updateEnergyUI(){
  const fill=$('#energy-fill');
  if(fill)fill.style.width=Math.max(5,energy)+'%';
}

function setShaking(on){
  const fi=$('#fi-shake');
  if(!fi)return;
  if(on&&!isShaking){
    fi.classList.add('shaking');
    isShaking=true;
  }else if(!on&&isShaking){
    fi.classList.remove('shaking');
    isShaking=false;
  }
}

function resetShakeState(){
  energy=0;
  isShaking=false;
  clearTimeout(energyDecayTimer);
  const fi=$('#fi-shake');
  if(fi){fi.classList.remove('shaking');$$('.fi-stick.rising',fi).forEach(s=>s.classList.remove('rising'))}
  updateEnergyUI();
  const hint=$('#shake-hint');
  if(hint)hint.style.display='';
}

function resetAll(){
  resetShakeState();
  fortuneNum=0;
  particles=[];
  cancelAnimationFrame(animFrame);
  /* Reset result screen */
  const stk=$('#result-stick');
  if(stk)stk.classList.remove('phase1','phase2','phase3');
  const nb=$('#result-num-bubble');
  if(nb)nb.classList.remove('show');
  const burst=$('#result-burst');
  if(burst)burst.classList.remove('show');
  ['#result-ring-1','#result-ring-2','#result-ring-3','#result-subtitle','#btn-read'].forEach(s=>{
    const el=$(s);if(el)el.classList.remove('show');
  });
  $$('.result-star').forEach(s=>s.classList.remove('show'));
}

/* ═══════════════════════════════════════
   VISUAL FEEDBACK — CLINK EFFECT
   ═══════════════════════════════════════ */
function triggerVisualClink(){
  const area=$('#shake-area');
  if(!area)return;
  const clink=document.createElement('div');
  clink.style.cssText=`
    position:absolute;left:${30+Math.random()*40}%;top:${20+Math.random()*40}%;
    width:24px;height:24px;border:2px solid var(--primary);border-radius:50%;
    opacity:1;pointer-events:none;z-index:5;
    animation:clink-expand .5s ease-out forwards;
  `;
  area.appendChild(clink);
  setTimeout(()=>clink.remove(),500);
}

/* Add clink animation */
if(!document.getElementById('dynamic-styles')){
  const style=document.createElement('style');
  style.id='dynamic-styles';
  style.textContent=`
    @keyframes clink-expand{
      0%{transform:scale(.3);opacity:.8}
      100%{transform:scale(1.5);opacity:0}
    }
  `;
  document.head.appendChild(style);
}

/* ═══════════════════════════════════════
   TRIGGER REVEAL
   ═══════════════════════════════════════ */
async function triggerReveal(){
  /* Pick fortune — fixed to 1 for testing max content */
  fortuneNum=1;

  /* Animate rising stick */
  const fi=$('#fi-shake');
  if(fi){
    fi.classList.remove('shaking');
    const sticks=$$('.fi-stick',fi);
    const risingIdx=Math.floor(Math.random()*sticks.length);
    sticks[risingIdx].classList.add('rising');
    haptic(100);
    playSfxRise();
    await wait(1200);
  }

  /* Hide hint */
  const hint=$('#shake-hint');
  if(hint)hint.style.display='none';

  /* Transition to result */
  transitionTo('s-result');
}

/* ═══════════════════════════════════════
   RESULT ANIMATION
   ═══════════════════════════════════════ */
async function playResultAnimation(){
  const stickEl=$('#result-stick');
  const burst=$('#result-burst');
  const ring1=$('#result-ring-1');
  const ring2=$('#result-ring-2');
  const ring3=$('#result-ring-3');
  const numBubble=$('#result-num-bubble');
  const numVal=$('#result-num-val');
  const subtitle=$('#result-subtitle');
  const stars=$$('.result-star');
  const btnRead=$('#btn-read');

  /* Reset all */
  [burst,ring1,ring2,ring3,subtitle,btnRead].forEach(el=>{if(el)el.classList.remove('show')});
  if(numBubble)numBubble.classList.remove('show');
  if(numVal)numVal.textContent='0';
  stars.forEach(s=>s.classList.remove('show'));
  if(stickEl)stickEl.classList.remove('phase1','phase2','phase3');

  /* ── ไม้ 1: เต็มแท่ง — ปรากฏทันที ต่อเนื่องจากฉากดึงไม้ ── */
  requestAnimationFrame(()=>{
    if(stickEl)stickEl.classList.add('phase1');
  });
  await wait(1200);

  /* ── ไม้ 2: ซูมเข้า + เรืองแสง ── */
  if(stickEl){stickEl.classList.remove('phase1');stickEl.classList.add('phase2')}
  if(burst)burst.classList.add('show');
  haptic(40);
  await wait(1200);

  /* ── ไม้ 3: ซูมเหลือครึ่งบน เน้นหัวไม้ ── */
  if(stickEl){stickEl.classList.remove('phase2');stickEl.classList.add('phase3')}
  await wait(800);

  /* ── เฉลยเลข: bubble ปรากฏที่หัวไม้ ── */
  if(numBubble)numBubble.classList.add('show');
  if(numVal)await animateCounter(numVal,fortuneNum);

  /* ── ทุกอย่างมาพร้อมกันตอนเลขเฉลย ── */
  haptic(80);
  playSfxReveal();
  launchConfetti();
  if(subtitle)subtitle.classList.add('show');
  if(ring1)ring1.classList.add('show');
  stars.forEach((s,i)=>setTimeout(()=>s.classList.add('show'),i*80));
  await wait(200);
  if(ring2)ring2.classList.add('show');
  await wait(200);
  if(ring3)ring3.classList.add('show');
  await wait(500);

  /* ── Button ── */
  btnRead.classList.add('show');
}

/* ═══════════════════════════════════════
   NUMBER COUNTER ANIMATION
   ═══════════════════════════════════════ */
async function animateCounter(el,target){
  const delays=[
    ...Array(12).fill(50),
    ...Array(5).fill(100),
    ...Array(3).fill(150),
    200,300,400
  ];
  for(const d of delays){
    el.textContent=Math.floor(Math.random()*28)+1;
    await wait(d);
  }
  el.textContent=target;
  /* Bounce effect */
  el.style.transform='scale(1.2)';
  await wait(150);
  el.style.transform='scale(1)';
}

/* ═══════════════════════════════════════
   CONFETTI / PARTICLE SYSTEM
   ═══════════════════════════════════════ */
function launchConfetti(){
  const canvas=$('#confetti');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const rect=canvas.parentElement.getBoundingClientRect();
  canvas.width=rect.width;
  canvas.height=rect.height;

  /* Confetti: primary pink, secondary purple, light tones */
  const colors=['#EC599D','#7279FB','#FDEFF5','#F1F2FF','#D94E8E','#9A9FFD','#FDE9ED'];
  particles=[];

  /* Spawn confetti */
  const cx=canvas.width/2;
  const cy=canvas.height*0.4;
  for(let i=0;i<60;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=3+Math.random()*8;
    particles.push({
      x:cx,y:cy,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed-3,
      size:3+Math.random()*5,
      color:colors[Math.floor(Math.random()*colors.length)],
      rotation:Math.random()*360,
      spin:(Math.random()-.5)*10,
      life:1,
      decay:.008+Math.random()*.015,
      gravity:.15,
      shape:Math.random()>.5?'rect':'circle'
    });
  }

  cancelAnimationFrame(animFrame);
  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles=particles.filter(p=>p.life>0);
    for(const p of particles){
      p.vy+=p.gravity;
      p.x+=p.vx;
      p.y+=p.vy;
      p.vx*=.98;
      p.life-=p.decay;
      p.rotation+=p.spin;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rotation*Math.PI/180);
      ctx.globalAlpha=p.life;
      ctx.fillStyle=p.color;
      if(p.shape==='rect'){
        ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
      }else{
        ctx.beginPath();
        ctx.arc(0,0,p.size/2,0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }
    if(particles.length>0){
      animFrame=requestAnimationFrame(animate);
    }else{
      ctx.clearRect(0,0,canvas.width,canvas.height);
    }
  }
  animate();
}

/* ═══════════════════════════════════════
   FORTUNE DISPLAY
   ═══════════════════════════════════════ */
const LEVEL_LABELS={excellent:'ดวงดีมาก',good:'ดวงดี',fair:'ดวงกลาง',caution:'ระวัง'};

function showFortune(){
  const fortune=FORTUNES.find(f=>f.num===fortuneNum)||FORTUNES[0];

  /* Number */
  const numBig=$('#fortune-num-big');
  const footerNum=$('#fortune-footer-num');
  if(numBig)numBig.textContent=fortune.num;
  if(footerNum)footerNum.textContent=fortune.num;

  /* Title */
  const titleEl=$('#fortune-title');
  if(titleEl)titleEl.textContent=fortune.title;

  /* Level badge */
  const levelEl=$('#fortune-level');
  if(levelEl){
    levelEl.dataset.level=fortune.level;
    levelEl.textContent=LEVEL_LABELS[fortune.level]||fortune.level;
  }

  /* Poem (กลอน) — show only if available */
  const poemEl=$('#fortune-poem');
  if(poemEl){
    if(fortune.poem){
      poemEl.style.display='';
      poemEl.innerHTML='';
      const lines=fortune.poem.split('\n');
      lines.forEach(line=>{
        const p=document.createElement('p');
        const isIndent=line.startsWith('\t');
        p.textContent=isIndent?line.replace(/^\t/,''):line;
        if(isIndent)p.classList.add('poem-indent');
        poemEl.appendChild(p);
      });
    }else{
      poemEl.style.display='none';
    }
  }

  /* Payakorn (คำทำนาย) — typewriter effect */
  const payakornEl=$('#fortune-payakorn');
  if(payakornEl){
    payakornEl.innerHTML='';
    const p=document.createElement('p');
    p.style.cssText='opacity:0;transform:translateY(8px);transition:all .5s ease';
    p.textContent=fortune.payakorn;
    payakornEl.appendChild(p);
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        p.style.opacity='1';
        p.style.transform='translateY(0)';
      });
    });
  }

  /* Advice (คำแนะนำ) */
  const adviceEl=$('#fortune-advice');
  if(adviceEl){
    adviceEl.innerHTML='';
    const p=document.createElement('p');
    p.style.cssText='opacity:0;transform:translateY(8px);transition:all .5s ease .2s';
    p.textContent=fortune.advice;
    adviceEl.appendChild(p);
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        p.style.opacity='1';
        p.style.transform='translateY(0)';
      });
    });
  }

  /* Lucky numbers */
  const luckyEl=$('#fortune-lucky');
  if(luckyEl&&fortune.lucky){
    luckyEl.innerHTML=fortune.lucky.map(n=>`<div class="fortune-lucky-num">${n}</div>`).join('');
  }
}

    /* Fallback: copy to clipboard */
    try{
      await navigator.clipboard.writeText(shareText);
      showCopiedToast();
    }catch(e){
      /* Extra fallback */
      const ta=document.createElement('textarea');
      ta.value=shareText;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      showCopiedToast();
    }
  }
}

function showCopiedToast(){
  const toast=document.createElement('div');
  toast.textContent='คัดลอกแล้ว!';
  toast.style.cssText=`
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
    background:var(--text-primary);color:#fff;padding:10px 24px;
    border-radius:var(--r-full);font-size:14px;font-weight:700;
    font-family:var(--font);z-index:999;
    animation:toast-in .3s ease;
  `;
  document.body.appendChild(toast);
  setTimeout(()=>{
    toast.style.opacity='0';
    toast.style.transition='opacity .3s';
    setTimeout(()=>toast.remove(),300);
  },1500);
}

/* Toast animation */
{
  const s=document.createElement('style');
  s.textContent=`@keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}`;
  document.head.appendChild(s);
}

   INIT
   ═══════════════════════════════════════ */
renderApp();
</script>
